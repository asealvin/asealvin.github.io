baseURL = 'https://asealvin.com/'
locale = 'zh-cn'
title = 'asealvin'
theme = 'PaperMod'
enableRobotsTXT = true

[params]
  defaultTheme = 'auto' # 支持暗色/亮色模式切换
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  # 隐藏菜单中外链链接自带的斜向上箭头图标
  hideOtherLanguagesInLanguageSwitcher = true # （非此项）
  # 隐藏外链图标的配置参数如下：
  disableExternalLinkIcon = true
  # 网站图标 (Favicon) 配置
  [params.favicon]
    url = "/favicon.ico" # 默认图标路径
    16x16 = "/favicon-16x16.png" # 16x16 像素小图标（可选）
    32x32 = "/favicon-32x32.png" # 32x32 像素图标（可选）
    apple = "/apple-touch-icon.png" # iOS 设备添加书签时的图标（可选）
  
  # 主页个人介绍配置
  [params.homeInfoParams]
    Title = "Hi, 我是 asealvin 👋"
    Content = "摄影师 / 写作者 / 公路车爱好者"

  [params.label]
    text = "asealvin"
    icon = "/images/asealvin-logo.png"
    iconHeight = 36

# 顶部导航栏菜单
[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "photography"
  name = "摄影"
  url = "https://photography.asealvin.com/"
  weight = 20

[[menu.main]]
  identifier = "cycling"
  name = "骑行"
  url = "https://cycling.asealvin.com/zh"
  weight = 30


