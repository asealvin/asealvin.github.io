<footer class="footer"><span>&copy; 2026 asealvin</span></footer>
<script>
  document.getElementById('theme-toggle')?.addEventListener('click', () => {
    const root = document.documentElement
    const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark'

    root.classList.add('theme-animating')
    root.dataset.theme = nextTheme
    localStorage.setItem('pref-theme', nextTheme)

    window.setTimeout(() => root.classList.remove('theme-animating'), 360)
  })
</script>
<script>
(() => {
  const zh = (navigator.language || 'en').toLowerCase().startsWith('zh');
  document.documentElement.lang = zh ? 'zh-CN' : 'en';
  const labels = {posts: ['文章', 'Articles'], photography: ['摄影', 'Photography'], cycling: ['骑行', 'Cycling'], podcast: ['播客', 'Podcast']};
  document.querySelectorAll('.menu a').forEach(a => {
    const url = new URL(a.href, location.href);
    const key = url.hostname.startsWith('photography.') ? 'photography' : url.hostname.startsWith('cycling.') ? 'cycling' : url.hostname.includes('firstory') ? 'podcast' : url.pathname.startsWith('/posts') ? 'posts' : null;
    if (!key) return;
    const label = a.querySelector('span') || a;
    label.textContent = labels[key][zh ? 0 : 1];
    if (key === 'cycling') a.href = 'https://cycling.asealvin.com/';
  });
  const title = document.querySelector('#home-hero-title');
  if (title) title.textContent = zh ? 'Hi，我是 asealvin 👋' : "Hi, I'm asealvin 👋";
  const intro = document.querySelector('.home-hero .entry-content');
  if (intro) intro.textContent = zh ? '摄影师 / 写作者 / 公路车爱好者' : 'Photographer / Writer / Road cyclist';
  if (!zh) {
    document.querySelectorAll('.page-header h1').forEach(el => {
      if (el.textContent.trim() === '文章' || el.textContent.trim() === 'Posts') el.textContent = 'Articles';
    });
  }
})();
</script>
