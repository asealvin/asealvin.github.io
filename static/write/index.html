<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>写文章 · asealvin</title>
  <style>
    :root{--bg:#10100f;--card:#181714;--line:#34322d;--text:#eee9df;--muted:#aaa398;--accent:#d7b06a;--danger:#e5867c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{max-width:920px;margin:auto;padding:48px 22px 90px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px}.eyebrow{color:var(--accent);letter-spacing:.3em;font-size:11px;font-weight:700}.brand{margin:3px 0 0;font:italic 30px Georgia,serif}button,.button{border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 15px;cursor:pointer;font:700 11px ui-sans-serif,sans-serif;letter-spacing:.13em;text-transform:uppercase;text-decoration:none}.primary{background:var(--accent);border-color:var(--accent);color:#15130e}.primary:disabled{opacity:.5;cursor:wait}.danger{color:var(--danger)}.card{background:var(--card);border:1px solid var(--line);padding:22px;margin:16px 0}.hidden{display:none!important}label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin:18px 0 7px}input,textarea{width:100%;background:#11110f;border:1px solid var(--line);color:var(--text);padding:12px;font:inherit}textarea{min-height:310px;resize:vertical}input:focus,textarea:focus{outline:1px solid var(--accent)}.grid{display:grid;grid-template-columns:1fr 190px;gap:14px}.help,.status{color:var(--muted);font-size:13px}.status{white-space:pre-line;margin-top:14px}.status.error{color:var(--danger)}.status.ok{color:#a8d98c}.drop{display:block;border:1px dashed #766044;padding:24px;text-align:center;color:var(--muted);cursor:pointer;margin-top:18px}.drop:hover{border-color:var(--accent);color:var(--text)}.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:22px}.preview{max-width:180px;max-height:100px;margin:8px 0;border:1px solid var(--line)}.token-note{font-size:13px;color:var(--muted)}.library{margin:16px 0}.library-head{display:flex;gap:12px;align-items:center;justify-content:space-between}.library-head input{max-width:300px}.article-list{margin-top:12px;border-top:1px solid var(--line)}.article{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:12px;text-transform:none;letter-spacing:0;font:inherit}.article:hover{color:var(--accent)}.article small{color:var(--muted);white-space:nowrap}@media(max-width:600px){.shell{padding:28px 15px}.grid{grid-template-columns:1fr}.actions{align-items:stretch;flex-direction:column}.actions button{width:100%}}
  </style>
</head>
<body><main class="shell">
  <header><div><div class="eyebrow">ASEALVIN · WRITER</div><div class="brand">写一篇新文章</div></div><a class="button" href="https://asealvin.com/">查看主站</a></header>
  <section id="gate" class="card"><div class="eyebrow">一次性连接</div><h2>连接文章仓库</h2><p class="token-note">令牌只保存在当前浏览器标签页，关闭后即清除。前往 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--accent)">GitHub → Settings → Developer settings → Fine-grained personal access tokens</a> 创建令牌；仅选择 <code>asealvin/asealvin.github.io</code>，并授予 Contents 的 Read and write 权限。</p><label>GitHub personal access token</label><input id="token" type="password" autocomplete="off" placeholder="github_pat_…"><div class="actions"><button id="connect" class="primary">连接并开始写作</button></div><p id="gate-status" class="status"></p></section>
  <section id="editor" class="hidden"><div class="card library"><div class="library-head"><div><div class="eyebrow">已发布文章</div><div id="article-count" class="help">正在载入…</div></div><input id="article-search" placeholder="搜索标题"></div><div id="article-list" class="article-list"></div></div><div class="card"><div class="eyebrow" id="editing-label">新文章</div><div class="grid"><div><label>标题</label><input id="title" placeholder="文章标题"></div><div><label>发布日期</label><input id="date" type="date"></div></div><label>摘要（可选）</label><input id="summary" placeholder="一句简短的引言，会显示在文章列表中"><label>正文</label><textarea id="body" placeholder="从这里开始写作。\n\n支持 Markdown：**粗体**、*斜体*、标题和链接。"></textarea><label class="drop" for="files">拖入或选择图片，自动压缩并插入到光标位置<input id="files" type="file" accept="image/*" multiple hidden></label><div id="images" class="help"></div><div class="actions"><button id="new-post">新建文章</button><button id="preview">在新窗口预览 Markdown</button><button id="publish" class="primary">发布文章</button></div><p id="status" class="status"></p></div></section>
</main><script>
(() => {
const $=s=>document.querySelector(s), repo='asealvin/asealvin.github.io', branch='main'; let token='', files=[], articles=[], editingPath='';
const enc=s=>btoa(unescape(encodeURIComponent(s))), slug=s=>s.trim().toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||`post-${Date.now()}`;
function message(t,type=''){const el=$('#status');el.textContent=t;el.className='status '+type}function api(path,options={}){return fetch('https://api.github.com'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${token}`,...options.headers}}).then(async r=>{if(!r.ok)throw Error(`GitHub ${r.status}: ${await r.text()}`);return r.status===204?null:r.json()})}
$('#date').value=new Date().toISOString().slice(0,10);
function decode64(value){const raw=atob(value.replace(/\n/g,'')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function parsePost(text){const matched=text.match(/^\+\+\+\n([\s\S]*?)\n\+\+\+\n?([\s\S]*)$/);const meta=matched?.[1]||'', body=matched?.[2]||text;const read=k=>meta.match(new RegExp('^'+k+'\\s*=\\s*"?([^"\\n]+)', 'm'))?.[1]?.trim()||'';return{title:read('title'),date:read('date'),summary:read('summary'),body}}
async function loadArticles(){const ref=await api('/repos/'+repo+'/git/ref/heads/'+branch),tree=await api('/repos/'+repo+'/git/trees/'+ref.object.sha+'?recursive=1');articles=tree.tree.filter(x=>x.type==='blob'&&x.path.startsWith('content/posts/')&&x.path.endsWith('.md')).map(x=>({path:x.path,sha:x.sha,title:x.path.endsWith('/index.md')?x.path.split('/').slice(-2,-1)[0]:x.path.split('/').pop().replace('.md','')}));renderArticles()}
function renderArticles(){const term=$('#article-search').value.trim().toLowerCase(), list=$('#article-list');const visible=articles.filter(x=>x.title.toLowerCase().includes(term)||x.path.toLowerCase().includes(term));$('#article-count').textContent='共 '+articles.length+' 篇文章';list.innerHTML='';for(const article of visible){const b=document.createElement('button');b.className='article';b.innerHTML='<span>'+article.title.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</span><small>编辑</small>';b.onclick=()=>openArticle(article);list.appendChild(b)}if(!visible.length)list.textContent='没有匹配的文章。'}
async function openArticle(article){try{message('正在读取文章…');const blob=await api('/repos/'+repo+'/git/blobs/'+article.sha),post=parsePost(decode64(blob.content));editingPath=article.path;$('#title').value=post.title||article.title;$('#date').value=(post.date||'').slice(0,10);$('#summary').value=post.summary;$('#body').value=post.body.trim();$('#editing-label').textContent='正在编辑：'+($('#title').value);$('#publish').textContent='更新文章';files=[];$('#images').textContent='';message('')}catch(e){message('读取文章失败：'+e.message,'error')}}
function newPost() {editingPath='';files=[];$('#title').value='';$('#summary').value='';$('#body').value='';$('#date').value=new Date().toISOString().slice(0,10);$('#editing-label').textContent='新文章';$('#publish').textContent='发布文章';$('#images').textContent='';message('')}
$('#connect').onclick=async()=>{token=$('#token').value.trim();const s=$('#gate-status');s.textContent='正在验证仓库权限…';try{await api('/repos/'+repo);sessionStorage.setItem('asealvin-writer-token',token);$('#gate').classList.add('hidden');$('#editor').classList.remove('hidden');await loadArticles()}catch(e){s.textContent='无法连接：'+e.message;s.className='status error'}};
async function prepare(file){const bitmap=await createImageBitmap(file), max=2200, scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.88));return {name:`image-${Date.now()}-${Math.random().toString(36).slice(2,6)}.jpg`,blob}}
async function addFiles(list){try{for(const f of [...list]){if(!f.type.startsWith('image/'))continue;message(`正在压缩 ${f.name}…`);const image=await prepare(f);files.push(image);insert(`\n\n![${f.name}](${image.name})\n`)}$('#images').textContent=`已准备 ${files.length} 张图片；它们会和文章一起发布。`;message('')}catch(e){message('图片处理失败：'+e.message,'error')}}
$('#files').onchange=e=>addFiles(e.target.files);const drop=$('.drop');drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
$('#files').addEventListener('change',e=>addFiles(e.target.files));
function insert(text){const el=$('#body'),a=el.selectionStart,b=el.selectionEnd;el.value=el.value.slice(0,a)+text+el.value.slice(b);el.selectionStart=el.selectionEnd=a+text.length;el.focus()}
$('#new-post').onclick=newPost;$('#article-search').oninput=renderArticles;
$('#preview').onclick=()=>{const w=window.open('','_blank');if(w)w.document.write(`<pre style="white-space:pre-wrap;font:16px/1.7 sans-serif;max-width:760px;margin:40px auto">${$('#body').value.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>`) };
$('#publish').onclick=async()=>{const title=$('#title').value.trim(),content=$('#body').value.trim();if(!title||!content)return message('请填写标题和正文。','error');const button=$('#publish');button.disabled=true;const id=editingPath?editingPath.replace(/^content\/posts\//,'').replace(/\/index\.md$|\.md$/,''):slug(title),folder=`content/posts/${id}`,markdownPath=editingPath||`${folder}/index.md`,date=$('#date').value||new Date().toISOString().slice(0,10),summary=$('#summary').value.trim();let markdown=`+++\ntitle = ${JSON.stringify(title)}\ndate = ${JSON.stringify(date)}\ndraft = false\n`;if(summary)markdown+=`summary = ${JSON.stringify(summary)}\n`;markdown+='+++\n\n'+content+'\n';try{message('正在创建文章和上传图片…');const changes=[{path:markdownPath,base64:enc(markdown)}];for(const img of files){const base64=await img.blob.arrayBuffer().then(b=>{let a=new Uint8Array(b),s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)});changes.push({path:`${folder}/${img.name}`,base64})}const tree=[];for(const change of changes){const blob=await api(`/repos/${repo}/git/blobs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:change.base64,encoding:'base64'})});tree.push({path:change.path,mode:'100644',type:'blob',sha:blob.sha})}for(let attempt=0;attempt<3;attempt++){const ref=await api(`/repos/${repo}/git/ref/heads/${branch}`),base=ref.object.sha,head=await api(`/repos/${repo}/git/commits/${base}`),newTree=await api(`/repos/${repo}/git/trees`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_tree:head.tree.sha,tree})}),commit=await api(`/repos/${repo}/git/commits`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`:memo: post: ${title}`,tree:newTree.sha,parents:[base]})});try{await api(`/repos/${repo}/git/refs/heads/${branch}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sha:commit.sha,force:false})});editingPath=markdownPath;$('#editing-label').textContent='正在编辑：'+title;$('#publish').textContent='更新文章';await loadArticles();message(`✓ 已发布。GitHub Pages 正在构建，约 1–2 分钟后可访问：\nhttps://asealvin.com/posts/${id}/`,'ok');files=[];$('#images').textContent='';return}catch(e){if(attempt===2)throw e}}}catch(e){message('发布失败：'+e.message,'error')}finally{button.disabled=false}};
const saved=sessionStorage.getItem('asealvin-writer-token');if(saved){$('#token').value=saved;}
})();
</script></body></html>
